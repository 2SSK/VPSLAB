name: vpslab

x-vps: &vps
  image: vpslab/ubuntu:24.04
  build: .
  cgroup: private
  security_opt: [writable-cgroups=true]
  cap_add: [NET_ADMIN, SYS_ADMIN]
  tmpfs: [/run, /run/lock]
  stop_grace_period: 30s
  restart: unless-stopped
  volumes:
    - type: bind
      source: ./keys/id_ed25519.pub
      target: /etc/vpslab/authorized_keys
      read_only: true
      bind:
        create_host_path: false
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"
  healthcheck:
    test: ["CMD-SHELL", "systemctl is-active --quiet ssh.socket"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  vps-01:
    <<: *vps
    container_name: vps-01
    hostname: vps-01
    ports: ["127.0.0.1:2201:22"]
    networks:
      vpslab:
        ipv4_address: 10.80.0.11

  vps-02:
    <<: *vps
    container_name: vps-02
    hostname: vps-02
    ports: ["127.0.0.1:2202:22"]
    networks:
      vpslab:
        ipv4_address: 10.80.0.12

  vps-03:
    <<: *vps
    container_name: vps-03
    hostname: vps-03
    ports: ["127.0.0.1:2203:22"]
    networks:
      vpslab:
        ipv4_address: 10.80.0.13

networks:
  vpslab:
    name: vpslab
    ipam:
      config:
        - subnet: 10.80.0.0/24
